<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1219">
  <title>Glass Lab · Simulateur de vitres</title>
  <link rel="icon" href="icons/icon-192.png">
  <style>
    :root { --bg: #0b1219; --panel: #131e29; --line: #253445; --text: #eef3f7; --muted: #9fb0c0; --accent: #f2ff1f; --glass: #8fe3ff; --mesh: #a6b1bd; --door: #ff9f1c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 18px; font-weight: 800; }
    header h1 span { color: var(--accent); }
    a.back { color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; white-space: nowrap; }
    main { display: grid; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 900px) { main { grid-template-columns: 360px minmax(0, 1fr); align-items: start; } .views { grid-column: 2; grid-row: 1 / span 2; } }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .card h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .views { display: grid; gap: 12px; }
    .view-row { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 640px) { .view-row { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); align-items: start; } }
    canvas { width: 100%; display: block; border-radius: 10px; background: #0e1822; touch-action: manipulation; }
    #viewTop { aspect-ratio: 1 / 2; max-height: 72vh; cursor: crosshair; }
    #viewSide { aspect-ratio: 20 / 7; }
    .hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); background: #182634; color: var(--text); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
    .chip.on { background: var(--accent); color: #0b1219; border-color: var(--accent); font-weight: 700; }
    .field { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 12px 0; }
    .field label { font-weight: 600; }
    .field output { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 700; }
    .field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
    .field small { grid-column: 1 / -1; color: var(--muted); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button.act { border: 0; border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer; background: var(--accent); color: #0b1219; }
    .points { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
    .summary { display: grid; gap: 6px; margin-bottom: 12px; }
    .summary div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
    .summary b { text-align: right; }
    .warn { color: var(--door); font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    td.n { width: 22px; font-weight: 800; }
    .k-floor { color: #b7f5c8; } .k-glass { color: var(--glass); } .k-mesh { color: var(--mesh); } .k-exit { color: var(--door); } .k-net { color: #ff8f8f; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Glass Lab · <span>Simulateur de vitres</span></h1>
    <a class="back" href="./">Retour au jeu</a>
  </header>
  <main>
    <section class="card" aria-labelledby="hParams">
      <h2 id="hParams">Le coup</h2>
      <div class="chips" id="presets" role="group" aria-label="Préréglages"></div>
      <div class="field"><label for="kmh">Vitesse de départ</label><output id="kmhOut"></output><input type="range" id="kmh" min="20" max="130" step="1"></div>
      <div class="row" role="group" aria-label="Trajectoire">
        <button class="chip" id="tense" type="button">Tendue</button>
        <button class="chip" id="lob" type="button">Lobée</button>
      </div>
      <div class="field"><label for="top">Lift / coupé</label><output id="topOut"></output><input type="range" id="top" min="-220" max="220" step="5"><small>à droite : lift (la balle plonge) · à gauche : coupé (elle flotte, puis freine)</small></div>
      <div class="field"><label for="side">Effet latéral</label><output id="sideOut"></output><input type="range" id="side" min="-190" max="190" step="5"><small>à droite : vers la droite de la trajectoire</small></div>
      <div class="field"><label for="hz">Hauteur de frappe</label><output id="hzOut"></output><input type="range" id="hz" min="0.3" max="3.1" step="0.05"></div>
      <p class="points" id="points"></p>
      <div class="row">
        <button class="act" id="replay" type="button">Rejouer</button>
        <button class="chip" id="speed" type="button">Ralenti ×¼</button>
      </div>
    </section>

    <section class="views" aria-label="Trajectoire">
      <div class="view-row">
        <figure class="card" style="margin:0">
          <h2>Vue de dessus</h2>
          <canvas id="viewTop" role="img" aria-label="Court vu de dessus, trajectoire et contacts"></canvas>
          <p class="hint">Touche ton camp (en bas) pour placer le rebond, le camp d'en face pour placer la frappe.</p>
        </figure>
        <figure class="card" style="margin:0">
          <h2>Vue de côté</h2>
          <canvas id="viewSide" role="img" aria-label="Court vu de côté : hauteur de la balle"></canvas>
          <div class="legend">
            <span><i style="background:var(--glass)"></i>vitre</span>
            <span><i style="background:var(--mesh)"></i>grille</span>
            <span><i style="background:var(--door)"></i>porte (ouverte)</span>
            <span><i style="background:var(--accent)"></i>balle</span>
          </div>
        </figure>
      </div>
    </section>

    <section class="card" aria-labelledby="hRes">
      <h2 id="hRes">Résultat</h2>
      <div class="summary" id="summary"></div>
      <table>
        <thead><tr><th>#</th><th>Contact</th><th>Instant</th><th>Hauteur</th><th>km/h</th></tr></thead>
        <tbody id="contacts"></tbody>
      </table>
    </section>
  </main>
  <script type="module" src="src/sim/simulator.js"></script>
</body>
</html>
