# Publie Glass Lab sur GitHub Pages (branche gh-pages) à chaque nouvelle version poussée.
# Les tests doivent passer : une version cassée n'est jamais publiée.
# tools/publier.sh ne republie jamais une version plus ancienne que celle en ligne ; une étiquette
# `publication-*` (ou un lancement manuel) force la republication du commit étiqueté.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
    tags: ['publication-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : comparer avec la version déjà en ligne

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node test/run.js

      - name: Publier sur gh-pages
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash tools/publier.sh
